[project]
name = "rigs-backend"
version = "0.1.0"
description = "The return arrow: episodes, faults and downtime coming back from twelve teleop rigs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # S3, which is what the platform team already runs. The interface in
    # core/infrastructure/storage.py is what the rest of the system
    # depends on; this is one implementation of it.
    "boto3>=1.35",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "import-linter>=2.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
# `workers` and `tools` belong here, not only `core` and `services`. The
# workers are the production processes - systemd runs `python -m
# workers.project_events` - and `tools.preflight` is the API unit's
# ExecStartPre. Left out, they imported only because `python -m` puts the
# working directory on sys.path, so the deployment worked by accident and
# would have broken the first time anything ran from another directory.
#
# `find` rather than a list, so a new domain under core/ does not have to
# be remembered here as well as in alembic/env.py and conftest.py.
include = ["core*", "services*", "workers*", "tools*"]
