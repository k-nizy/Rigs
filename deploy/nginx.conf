# One origin for the whole floor.
#
# The rig fetches with rooted paths - /api/rigs/RIG-07/schedule.json - so
# the apps and the service must answer on the same origin. That is not a
# convenience: the rig attaches its bearer token only to same-origin
# calls, deliberately, so a presigned upload URL pointing at an object
# store never receives a floor credential. Split them and either the calls
# fail CORS or the token stops travelling.
#
# The URL layout mirrors the repository exactly - /apps/rig/,
# /rotation-desk-v1/, /packages/ - and that is deliberate rather than
# lazy. Both pages load the engine by relative path: the desk asks for
# ../packages/, the rig for ../../packages/, and both resolve to
# /packages/ only from those directories. Serving them at tidier URLs
# like /rig/ and /desk/ silently breaks that, and it breaks it at deploy
# time on a floor rather than here. It is also the layout every test and
# the whole end-to-end run has used.
#
# Not tested on this machine - there is no nginx here. Everything it
# proxies to is verified; the proxying itself is not. Read it first.

upstream rigs_service {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # A checkout of this repository, or just the three static folders and
    # packages/. Nothing under backend/ should be served.
    root /srv/rigs;

    # The floor is a private network and this is a pilot. Put TLS in front
    # before anything crosses a link you do not own - the rig token is a
    # bearer token, and a bearer token in cleartext is a shared secret
    # shouted across the room.

    # One camera of one episode. 2 GiB matches MAX_VIDEO_BYTES, so an
    # oversized upload is refused by the same number in both places rather
    # than by whichever happens to be smaller.
    client_max_body_size 2048m;

    location /api/ {
        proxy_pass http://rigs_service;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The service uses this when it is set and mints one when it is
        # not, so a line in its log joins a line here.
        proxy_set_header X-Request-ID      $request_id;

        # Video through the service is the slow path; the default 60s
        # closes a legitimate upload mid-flight.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;      # stream it, do not spool it here
    }

    # Which rig this machine is. Proxied, not served from disk, and that
    # is the whole point.
    #
    # The page asks for this path relatively and the kiosk loads the page
    # from here, so a file placed on the rig machine is never read - the
    # browser asks the server for its copy. One file on this box therefore
    # meant twelve machines with one identity: every episode filed under
    # one rig, and nothing downstream able to notice, because from the
    # service's side that is exactly what one very busy rig looks like.
    #
    # So the service answers per caller, from RIG_ADDRESSES. It reads
    # X-Real-IP below, and believes it only because this proxy is on
    # 127.0.0.1 - which is why the header is set unconditionally here
    # rather than passed through.
    location = /apps/rig/rig-config.js {
        proxy_pass http://rigs_service/api/rigs/config.js;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Request-ID $request_id;

        # A stale copy is a rig filing every episode under another rig's
        # name. The service says the same thing; both, because either one
        # alone is a single point of failure for a silent error.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # The desk is served to anyone who can reach this, and that is a
    # decision rather than an oversight.
    #
    # An `auth_request` here would gate the page itself. It is not worth
    # it: the shell holds no floor data - every name, turn and score
    # arrives from /api/, which is gated per route and refuses an
    # operator with 403 - so what is public is an empty screen. Gating
    # it would also mean exempting whatever the sign-in page itself
    # needs, or there is nothing to sign in *with*; and it would make
    # static files depend on the service being up, which is exactly the
    # case the desk is built to survive - with no service reachable it
    # falls back to the plan on screen and says so.
    #
    # If that trade ever stops being right, the thing to add is
    # auth_request against a service route, not a second password here.
    #
    # The three apps and the code they share, at the paths they expect.
    #
    # Named one by one rather than serving /apps/, because apps/ also
    # holds the development push server: apps/server/ and its state.json,
    # the whole floor's pushed schedules, neither of which is anybody's
    # business over HTTP. A new app under apps/ therefore needs a line
    # here or it 404s - which is the safe direction to fail.
    # Every one of these is revalidated before it is reused.
    #
    # None of these paths carries a content hash - the page asks for
    # `assets/desk.js`, never `assets/desk.a1b2c3.js` - so a browser left
    # to guess how long a file stays fresh will serve whatever it kept.
    # What that looks like is new script against old markup: a masthead
    # over a blank page. It happened twice while My Shift was being
    # built, and it took a browser to see, because no headless test has a
    # cache.
    #
    # `/packages/` is the one that matters most, and it is not obvious.
    # It serves rotation-engine.js. A rig running a cached engine while
    # the desk runs a new one is the founding rule of this system broken
    # by an HTTP header - the rig computing a different answer from the
    # desk that scheduled it. The kiosk is a long-lived browser nobody
    # reloads by hand, so it is also the one least likely to notice.
    #
    # `no-cache`, not `no-store`: the file may be kept, it just has to be
    # asked about. An unchanged asset costs a 304 rather than a download,
    # which on a floor network is nothing. `rig-config.js` above is the
    # stricter case - never reused at all - and says why there.
    #
    # Written on each block rather than once on the server, because an
    # `add_header` in a child discards every inherited one; a per-block
    # header added later for some other reason would silently take this
    # with it.
    location /apps/rig/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /apps/my-shift/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /rotation-desk-v1/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /packages/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The landing page, which is a real file at the top of the repo and
    # links to all three apps. The kiosk points at /apps/rig/ directly
    # rather than being redirected here - see DEPLOY.md.
    location = / {
        try_files /index.html =404;
        # Same reason as the apps above: it is HTML with no content hash
        # in its name, and it is the page that links to all three.
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # For a load balancer, if there is one. It runs a real query and
    # answers 503 when the database is unreachable, so it is safe to pull
    # an instance out of rotation on.
    location = /healthz {
        proxy_pass http://rigs_service/api/health;
        access_log off;
    }

    # Nothing else. backend/, .env, .git and the venv are all under the
    # same checkout if you deployed it that way.
    location / { return 404; }
}
